plugins {
    id 'java'
}

group = 'com.yamap3'
version = '1.0.0'

repositories {
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}

def runeLiteVersion = findProperty('runeliteVersion') ?: 'latest.release'

dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.register('run', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.yamap3.YamaP3Launcher'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}
